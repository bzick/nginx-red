worker_processes 1;
error_log stderr info;
env RED_CONFIG_PATH;

events {
    worker_connections 128;
}

http {
    lua_shared_dict cache 1m;
    lua_package_path ';;/var/www/src/red/?.lua;/var/www/src/vendor/share/lua/5.1/?.lua;';
    init_by_lua_file /var/www/src/master.lua;
    init_worker_by_lua_file /var/www/src/worker.lua;

    server {
        listen 80;

        location = /internal/ {
            rewrite ^ /internal/index.html last;
        }

        location = /rewritten/index.html {
            rewrite ^ / break;
            rewrite_by_lua_file /var/www/src/redirect.lua;
            proxy_pass http://127.0.0.1:8080;
        }

        location / {
            rewrite_by_lua_file /var/www/src/redirect.lua;
            proxy_pass http://127.0.0.1:8080;
        }
    }

    server {
        listen 8080;
        location / {
            add_header X-Request-Uri $uri always;
            return 418;
        }
    }
}
